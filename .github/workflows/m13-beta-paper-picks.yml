name: StatRally beta paper picks
on:
  workflow_dispatch:
  schedule:
    - cron: "23 8,14 * * *"
      timezone: "America/Chicago"
permissions:
  contents: read
  issues: write
concurrency:
  group: statrally-beta-paper-picks
  cancel-in-progress: false
jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation
      - uses: actions/checkout@v4
        with:
          repository: stelladeecoder/statrally-soccer-btts
          ref: main
          token: ${{ secrets.STAT_RALLY_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install private research runtime dependency
        run: python -m pip install pandas
      - name: Capture verified experimental signals
        working-directory: engine
        env:
          PYTHONPATH: ../automation/src:src
        run: python ../automation/src/m13_beta_capture.py --output "$RUNNER_TEMP/beta.json"
      - name: Persist paper log and post eligible beta signals
        env:
          PYTHONPATH: automation/src
          BETA_INPUT_FILE: ${{ runner.temp }}/beta.json
          GH_TOKEN: ${{ github.token }}
          STATRALLY_PICKS_DISCORD_WEBHOOK: ${{ secrets.STATRALLY_PICKS_DISCORD_WEBHOOK }}
        run: python automation/src/m13_beta_dispatch.py
