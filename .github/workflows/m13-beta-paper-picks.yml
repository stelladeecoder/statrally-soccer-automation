name: StatRally beta paper picks
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  issues: write
concurrency:
  group: statrally-beta-paper-picks
  cancel-in-progress: false
jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation
      - uses: actions/checkout@v4
        with:
          repository: stelladeecoder/statrally-soccer-btts
          ref: main
          token: ${{ secrets.STAT_RALLY_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install private research and Polymarket US runtime dependencies
        run: python -m pip install pandas polymarket-us
      - name: Export independently mapped Polymarket US experimental signals
        working-directory: engine
        env:
          PYTHONPATH: ../automation/src:src
        run: python src/m15_polymarket_beta_export.py --discover --days 1 --output "$RUNNER_TEMP/beta.json" --diagnostics "$RUNNER_TEMP/coverage.json"
      - name: Report schedule and BTTS market eligibility separately
        env:
          PYTHONPATH: automation/src
        run: |
          python - <<'PY'
          import json
          import os
          from m17_coverage_status import summarize_beta_diagnostics
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "coverage.json").read_text())
          report = summarize_beta_diagnostics(data)
          print("STATRALLY_COVERAGE_STATUS=" + json.dumps(report, sort_keys=True))
          if data.get("discovery", {}).get("provider_errors") or report.get("counts_by_status", {}).get("source_incomplete", 0):
              raise SystemExit("STATRALLY_POLYMARKET_SOURCE_INCOMPLETE: check data export logs")
          PY
      - name: Persist Polymarket US paper log and post eligible beta signals
        env:
          PYTHONPATH: automation/src
          BETA_INPUT_FILE: ${{ runner.temp }}/beta.json
          GH_TOKEN: ${{ github.token }}
          STATRALLY_PICKS_DISCORD_WEBHOOK: ${{ secrets.STATRALLY_PICKS_DISCORD_WEBHOOK }}
        run: python automation/src/m13_beta_dispatch.py

