name: Validate public automation
on:
  workflow_dispatch:
    inputs:
      m14_account_mode:
        description: Public tests, or manual private Kalshi validation on this ref
        type: choice
        options: [offline-tests, auth-only, reconcile]
        default: offline-tests
        required: true
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: public-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  smoke-test:
    if: github.event_name != 'workflow_dispatch' || inputs.m14_account_mode == 'offline-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hash-verified signature dependencies (no account credentials)
        run: python -m pip install --no-cache-dir --require-hashes --only-binary=:all: -r requirements-m14-auth.txt
      - name: Run all public tests including M14 (synthetic data, mocked HTTP)
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import os
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          def tests_in(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from tests_in(item)
                  else:
                      yield item
          selected = list(tests_in(suite))
          m14_count = sum(test.id().startswith("test_m14_") for test in selected)
          if not selected or not m14_count:
              sys.exit("Full public suite and M14 tests must be discovered")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Tests run: {result.testsRun}; M14 tests selected: {m14_count}; "
                            f"failures: {len(result.failures)}; errors: {len(result.errors)}; "
                            f"skipped: {len(result.skipped)}.\n")
          print(f"::notice title=Public regression test counts::Tests run: {result.testsRun}; "
                f"M14 selected: {m14_count}; failures: {len(result.failures)}; "
                f"errors: {len(result.errors)}; skipped: {len(result.skipped)}.")
          sys.exit(0 if result.wasSuccessful() and result.testsRun == len(selected) else 1)
          PY
  m14-private-validation:
    if: github.event_name == 'workflow_dispatch' && (inputs.m14_account_mode == 'auth-only' || inputs.m14_account_mode == 'reconcile')
    uses: ./.github/workflows/m14-kalshi-reconciliation.yml
    with:
      mode: ${{ inputs.m14_account_mode }}
    secrets:
      KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
      KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
      M14_RECONCILIATION_EVIDENCE_URL: ${{ secrets.M14_RECONCILIATION_EVIDENCE_URL }}
      M14_EVIDENCE_ACCESS_TOKEN: ${{ secrets.M14_EVIDENCE_ACCESS_TOKEN }}
