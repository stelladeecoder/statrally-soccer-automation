name: Validate public automation scaffold
on:
  workflow_dispatch:
    inputs:
      design_preview:
        description: Send one fictional DESIGN TEST message to each configured channel
        type: boolean
        required: true
        default: false
  pull_request:
    branches: [main]
    paths: ["src/**", "tests/**", "scripts/**", "config/**", "discord-app/prediction-quality.mjs", ".github/workflows/**"]
permissions:
  contents: read
jobs:
  smoke-test:
    if: github.event_name != 'workflow_dispatch' || !inputs.design_preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install reporting image dependency
        run: python -m pip install Pillow==11.3.0
      - name: Test public scaffold
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
  design-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.design_preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: statrally-fictional-design-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send exactly three fictional design messages (no official records)
        env:
          STATRALLY_DISCORD_WEBHOOK: ${{ secrets.STATRALLY_DISCORD_WEBHOOK }}
          STATRALLY_PICKS_DISCORD_WEBHOOK: ${{ secrets.STATRALLY_PICKS_DISCORD_WEBHOOK }}
          STATRALLY_RESULTS_DISCORD_WEBHOOK: ${{ secrets.STATRALLY_RESULTS_DISCORD_WEBHOOK }}
        run: python src/m13_design_preview.py --send
