name: StatRally beta paper grading
on:
  workflow_dispatch:
    inputs:
      publish_discord:
        description: Publish verified outcomes after immutable grading
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish_discord:
        type: boolean
        default: true
permissions:
  contents: read
  issues: write
concurrency:
  group: statrally-prediction-ledger-writer
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation
      - uses: actions/checkout@v4
        with:
          repository: stelladeecoder/statrally-soccer-btts
          ref: main
          token: ${{ secrets.STAT_RALLY_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing monitoring dependency
        run: python -m pip install numpy==2.3.5
      - name: Grade all issued forecasts independently of market and Discord availability
        env:
          PYTHONPATH: automation/src
          GH_TOKEN: ${{ github.token }}
        run: |
          python automation/src/prediction_platform.py grade
          python automation/src/prediction_platform.py export --output "$RUNNER_TEMP/canonical.json"
      - name: Reuse existing proper-score and classification metrics without model experiments
        working-directory: engine
        env:
          PYTHONPATH: src
        run: python src/forward_prediction_monitoring.py --input "$RUNNER_TEMP/canonical.json" --output "$RUNNER_TEMP/metrics.json"
      - name: Save sanitized forward-performance analytics
        env:
          PYTHONPATH: automation/src
          GH_TOKEN: ${{ github.token }}
        run: python automation/src/prediction_platform.py metrics --input "$RUNNER_TEMP/metrics.json"
      - name: Publish only verified final outcomes with durable reservations
        if: inputs.publish_discord
        env:
          PYTHONPATH: automation/src
          GH_TOKEN: ${{ github.token }}
          STATRALLY_RESULTS_DISCORD_WEBHOOK: ${{ secrets.STATRALLY_RESULTS_DISCORD_WEBHOOK }}
        run: python automation/src/prediction_platform.py results
      # The canonical ledger publisher above is the sole results-channel writer.
      # Do not run m13_beta_grade_issues.py here: it uses an independent
      # reservation ledger and can publish duplicate cards for the same match.
