name: Publish public Discord read-only snapshot
on:
  push:
    branches: [main]
    paths:
      - "config/prediction_selection_policy.json"
      - "discord-app/prediction-quality.mjs"
      - "discord-app/build-snapshot.mjs"
      - "discord-app/platform-data.mjs"
      - ".github/workflows/publish-discord-snapshot.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: statrally-discord-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate public records from verified bot-authored issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node discord-app/build-snapshot.mjs
      - name: Regenerate snapshot on latest main and publish safely
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Snapshots are generated data, not source patches. Never rebase
          # stale generated JSON through another snapshot commit.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node discord-app/build-snapshot.mjs
            git add docs/discord-public-snapshot.json docs/predictions-public.json docs/predictions-public-v2.json
            if git diff --cached --quiet; then
              echo "Public snapshot already current"
              exit 0
            fi
            git -c user.name="github-actions[bot]" \\
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \\
                commit -m "data(discord): refresh public read-only records [skip ci]"
            if git push origin HEAD:main; then
              echo "Fresh public snapshot committed"
              exit 0
            fi
            echo "Snapshot changed concurrently; rebuilding against latest main ($attempt/5)"
          done
          echo "Public snapshot not confirmed after retry attempts"
          exit 1
