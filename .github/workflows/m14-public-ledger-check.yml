name: Verify M14 public ledger
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/m14-public-ledger-check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: M14 ledger tests in public repository
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_m14_position_ledger.py' -v
