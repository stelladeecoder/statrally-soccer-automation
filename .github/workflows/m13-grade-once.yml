name: One-time beta grading verification
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/m13-grade-once.yml]
permissions:
  contents: read
jobs:
  grade-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run beta grading and dispatch unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_m13_beta*.py' -v
