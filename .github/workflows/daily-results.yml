name: StatRally daily results summary
on:
  workflow_dispatch:
    inputs:
      publish_discord:
        description: Publish real verified daily results (no synthetic data)
        type: boolean
        default: false
  workflow_run:
    # Backstop the daily cron using the independently recovered posting scheduler.
    workflows: ["StatRally automatic posting scheduler"]
    types: [completed]
    branches: [main]
  push:
    # One-off recovery when this workflow is repaired, without running on data commits.
    branches: [main]
    paths: [".github/workflows/daily-results.yml"]
  schedule:
    # Dual UTC windows cover 8:15 AM Central in both standard/daylight time.
    # Both windows run; durable ledger receipts make repeat delivery idempotent.
    - cron: "15 13,14 * * *"
permissions:
  contents: read
  issues: write
concurrency:
  group: statrally-prediction-ledger-writer
  cancel-in-progress: false
jobs:
  daily:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_run' || inputs.publish_discord }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Central-time backup window
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          import os
          local = datetime.now(ZoneInfo("America/Chicago")).time()
          due = os.environ["EVENT_NAME"] != "workflow_run" or time(8, 20) <= local <= time(10, 15)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("due=" + str(due).lower() + "\n")
          print("Daily results backup gate:", due)
          PY
      - name: Test reporting and durable-delivery safeguards
        if: steps.gate.outputs.due == 'true'
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_daily_results.py' -v
      - name: Grade all outstanding issued predictions using verified finals
        if: steps.gate.outputs.due == 'true'
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
        run: python src/prediction_platform.py grade
      - name: Publish and reconcile daily and Top 3 performance summaries
        if: steps.gate.outputs.due == 'true'
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          STATRALLY_DAILY_RESULTS_DISCORD_WEBHOOK: ${{ secrets.STATRALLY_DAILY_RESULTS_DISCORD_WEBHOOK }}
        run: python src/daily_results.py
