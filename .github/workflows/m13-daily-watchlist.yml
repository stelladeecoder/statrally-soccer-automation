name: Daily soccer fixture watchlist
on:
  workflow_dispatch:
  schedule:
    # Temporary UTC-only, read-only scheduler verification.
    - cron: "*/5 * * * *"
permissions:
  contents: read
  issues: write
concurrency:
  group: statrally-daily-watchlist
  cancel-in-progress: false
jobs:
  scheduler-check:
    if: github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify unattended schedule trigger
        run: echo "Scheduled event received for $GITHUB_WORKFLOW at $(date -u +%FT%TZ)"
  post:
    if: github.event_name != 'schedule' || github.event.schedule != '*/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation
      - uses: actions/checkout@v4
        with:
          repository: stelladeecoder/statrally-soccer-btts
          ref: main
          token: ${{ secrets.STAT_RALLY_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch fixtures
        working-directory: engine
        env:
          PYTHONPATH: src
        run: python src/m13_daily_fixtures.py > "$RUNNER_TEMP/fixtures.json"
      - name: Post daily fixtures
        env:
          PYTHONPATH: automation/src
          WATCHLIST_INPUT_FILE: ${{ runner.temp }}/fixtures.json
          GH_TOKEN: ${{ github.token }}
          STATRALLY_DISCORD_WEBHOOK: ${{ secrets.STATRALLY_DISCORD_WEBHOOK }}
        run: python automation/src/m13_watchlist_dispatch.py
