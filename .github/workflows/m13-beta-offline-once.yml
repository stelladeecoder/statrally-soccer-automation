name: M13 beta offline verification
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/m13-beta-offline-once.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run beta input validation tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_m13_beta_signals.py' -v
